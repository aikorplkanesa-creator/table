<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Berhasil Disimpan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hasil-container">

        <h1>Data Berhasil Disimpan</h1>

        <div class="data-item">
            <strong>Nama:</strong>
            <span id="hasilNama"></span>
        </div>

        <div class="data-item">
            <strong>Alamat:</strong>
            <span id="hasilAlamat"></span>
        </div>

        <div class="data-item">
            <strong>Jurusan:</strong>
            <span id="hasilJurusan"></span>
        </div>

        <div class="data-item">
            <strong>Jenis Kelamin:</strong>
            <span id="hasilGender"></span>
        </div>

        <div class="data-item">
            <strong>Tinggi Badan:</strong>
            <span id="hasilTinggi"></span> cm
        </div>

        <div class="data-item">
            <strong>Berat Badan:</strong>
            <span id="hasilBerat"></span> kg
        </div>

        <div class="data-item">
            <strong>Hobi:</strong>
            <span id="hasilHobi"></span>
        </div>

        <div class="data-item">
            <strong>No. HP:</strong>
            <span id="hasilNohp"></span>
        </div>

        <a href="index.html" class="form-2">
            Kembali ke Form
        </a>

    </main>

    <script src="script.js"></script>

</body>
</html>
